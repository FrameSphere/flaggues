<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Large Flag -->
  <rect x="450" y="200" width="300" height="200" fill="#EF4444" rx="8"/>
  <rect x="450" y="280" width="300" height="60" fill="#FFF"/>
  <rect x="450" y="340" width="300" height="60" fill="#22C55E"/>
  
  <!-- Title -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="white" text-anchor="middle">FlagGuess</text>
  
  <!-- Subtitle -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="40" fill="white" text-anchor="middle">Erkenne Länderflaggen weltweit!</text>
</svg>
