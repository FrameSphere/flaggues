<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Library - FlagGuess</title>
    <meta name="description" content="Entdecke alle Flaggen der Welt! Über 190 Länderflaggen mit Informationen zu Kontinent, Region und Hauptstadt.">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3654554314003005"
     crossorigin="anonymous"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/favicon.svg">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://flaggues.pages.dev/library.html">
    
    <!-- Preconnect für schnelleres Laden -->
    <link rel="preconnect" href="https://flagcdn.com">
    <link rel="dns-prefetch" href="https://flagcdn.com">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/library.css">
    
</head>
<body data-theme="dark">
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <h1>🌍 Flag Library</h1>
                    <p id="subtitle">Entdecke alle Flaggen der Welt</p>
                </div>
                <div class="header-controls">
                    <!-- Back to Game -->
                    <a href="index.html" class="btn-back">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span id="backToGame">Zurück zum Spiel</span>
                    </a>
                    <!-- Search Input -->
                    <div class="search-wrapper">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Suche nach Land oder Kontinent..."
                            autocomplete="off"
                        >
                    </div>
                    <!-- Language Selector -->
                    <select id="languageSelect" class="language-select" aria-label="Sprache wählen">
                        <option value="de">🇩🇪 DE</option>
                        <option value="en">🇬🇧 EN</option>
                    </select>
                    <!-- Theme Toggle -->
                    <button id="themeToggle" class="theme-toggle" aria-label="Theme wechseln">
                        <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="totalCountries">0</div>
                <div class="stat-label" id="totalCountriesLabel">Länder insgesamt</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="continentsCount">6</div>
                <div class="stat-label" id="continentsLabel">Kontinente</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="displayedCount">0</div>
                <div class="stat-label" id="displayedLabel">Angezeigt</div>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
            <h2 class="section-title" id="filterTitle">Filtern nach Kontinent</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-continent="all" id="filterAll">
                    🌍 Alle
                </button>
                <button class="filter-btn" data-continent="europe" id="filterEurope">
                    🇪🇺 Europa
                </button>
                <button class="filter-btn" data-continent="asia" id="filterAsia">
                    🌏 Asien
                </button>
                <button class="filter-btn" data-continent="africa" id="filterAfrica">
                    🌍 Afrika
                </button>
                <button class="filter-btn" data-continent="americas" id="filterAmericas">
                    🌎 Amerika
                </button>
                <button class="filter-btn" data-continent="oceania" id="filterOceania">
                    🌊 Ozeanien
                </button>
            </div>
        </section>

        <!-- Cards Grid -->
        <main class="library-grid" id="libraryGrid">
            <!-- Cards werden hier dynamisch eingefügt -->
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-copyright">
                    © 2026 FlagGuess · powered by <a href="https://frame-sphere.vercel.app" class="footer-link">FrameSphere</a>
                </div>
                <div class="footer-links">
                    <a href="index.html" class="footer-link" id="backToGameFooter">Zurück zum Spiel</a>
                    <span class="footer-separator">·</span>
                    <a href="impressum.html" class="footer-link">Impressum</a>
                    <span class="footer-separator">·</span>
                    <a href="datenschutz.html" class="footer-link">Datenschutz</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/js/countries.js"></script>
    <script src="/js/library-data.js"></script>
    <script src="/js/library-translations.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/language-router.js"></script>
    <script src="/js/library.js"></script>
</body>
</html>
